# Isolated reviewer stack; does not replace the main deployment or its database.
name: cuberouter-studio-review
services:
  cuberouter:
    image: cuberouter-studio-review:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${STUDIO_BIND_ADDRESS:-127.0.0.1}:${STUDIO_PORT:-3001}:3000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Run init_deployment.py first}
      SQLITE_PATH: /data/cuberouter.db
      MEDIA_STUDIO_BRIDGE_URL: http://127.0.0.1:18163
      MEDIA_STUDIO_BRIDGE_KEY: ${MEDIA_STUDIO_BRIDGE_KEY:?Run init_deployment.py first}
    volumes:
      - router-data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/status"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  studio-adapter:
    image: cuberouter-studio-adapter:local
    build:
      context: ./scripts/qwen_image_bridge
      target: adapter
    restart: unless-stopped
    # Shares only the router's network namespace; no adapter port is published.
    network_mode: service:cuberouter
    environment:
      QWEN_BRIDGE_API_KEY: ${MEDIA_STUDIO_BRIDGE_KEY:?Run init_deployment.py first}
      QWEN_BRIDGE_PORT: "18163"
      QWEN_WORKFLOW_ORIGIN: ${QWEN_WORKFLOW_ORIGIN:-http://127.0.0.1:18162}
      QWEN_STUDIO_DATA: /data/media-studio
      QWEN_STUDIO_RETENTION_DAYS: "30"
    volumes:
      - studio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18163/health', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  workflow-tunnel:
    profiles: [ssh]
    build:
      context: ./scripts/qwen_image_bridge
      target: tunnel
    restart: unless-stopped
    network_mode: service:cuberouter
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - type: bind
        source: ${STUDIO_SSH_DIR:-./.media-studio/ssh}
        target: /run/ssh
        read_only: true
        bind:
          create_host_path: false
    command: ["-F", "/tmp/studio-ssh/config", "-NT", "-o", "BatchMode=yes", "-o", "ExitOnForwardFailure=yes", "-o", "StrictHostKeyChecking=yes", "-o", "ServerAliveInterval=20", "-o", "ServerAliveCountMax=3", "-L", "127.0.0.1:18162:127.0.0.1:8002", "workflow"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read only the mounted SSH files even if their host UID differs.
    cap_add:
      - DAC_OVERRIDE

volumes:
  router-data:
  studio-data:
