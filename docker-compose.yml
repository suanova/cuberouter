# cuberouter Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#   3. DSH agent runtime (optional) at http://localhost:3080; it builds from
#      ./docker/dsh, stores data in ./data/dsh/zhongshan and ships the Office
#      skills used to generate PPT/DOCX/XLSX deliverables.
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  cuberouter:
    image: harbor.isuanova.com/suanova/cuberouter:${CUBEROUTER_IMAGE_TAG:-latest}
    container_name: cuberouter
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
#      - "443:443"  # HTTPS 端口，配置 TLS_CERT_FILE/TLS_KEY_FILE 后生效 (HTTPS port; active once TLS_CERT_FILE/TLS_KEY_FILE are set)
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/cuberouter # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/cuberouter  # Point to the mysql service, uncomment if using MySQL
#      - LOG_SQL_DSN=postgresql://root:123456@postgres:5432/cuberouter-log # OPTIONAL: If you want a separate database for logging, uncomment and set this
#      - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/new_api_logs # OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
#      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 # OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=cuberouter-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
      - DSH_UPLOAD_DIR=${DSH_UPLOAD_DIR:-/data/dsh/zhongshan/uploads}  # 网关侧写入附件的目录；与 dsh 容器的 /data/uploads 是同一卷 (Gateway-side directory for agent attachments; same volume as /data/uploads inside the dsh container)
      - DSH_UPLOAD_MOUNT=${DSH_UPLOAD_MOUNT:-/data/uploads}  # 附件在 dsh 容器内的可见路径，会拼进提示词的清单 (Path the dsh container sees for attachments; listed in the prompt manifest)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - RELAY_IDLE_CONN_TIMEOUT=90  # Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SESSION_COOKIE_SECURE=true  # true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
#      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  # Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
#      - TLS_CERT_FILE=/data/cert.pem  # HTTPS 证书文件，需同时挂载证书文件到容器内 (HTTPS certificate file; mount the file into the container as well)
#      - TLS_KEY_FILE=/data/key.pem  # HTTPS 私钥文件，必须与 TLS_CERT_FILE 成对设置 (HTTPS private key file; must be set together with TLS_CERT_FILE)
#      - TLS_PORT=443  # HTTPS 监听端口 (HTTPS listening port)
#      - TRUSTED_PROXIES=172.20.0.0/16  # 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式，显式列表替代默认值 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
#      - USER_SESSION_ACTIVE_LIMIT=50
#      - USER_SESSION_ISSUANCE_LIMIT=100
#      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  # 不得大于 revoked 保留期 (must not exceed revoked retention)
#      - USER_SESSION_REVOKED_RETENTION_DAYS=7
#      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  # 仅告警，不做全局拒绝 (alert only; never globally rejects login)
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)
#      - BASE_PATH=/cuberouter  # 反向代理把站点发布在子路径时设置，只写路径不要写完整 URL；留空为站点根路径 (URL path prefix when a reverse proxy publishes the app under a subpath; path only, empty means the site root). 健康检查仍走不带前缀的 /api/status (healthcheck stays unprefixed)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
#      - clickhouse  # Uncomment if using ClickHouse for LOG_SQL_DSN
    networks:
      - cuberouter-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # DSH（DeepSeek Harness）智能体运行时：为 DSH 任务渠道提供 /api/v1/tasks
  # 接口，并内置 Office 技能（可直接生成 PPT/DOCX/XLSX）。
  # 数据（profile、会话、工作目录与生成的演示文稿）落在宿主机
  # ./data/dsh/zhongshan，容器内即 /data。
  dsh:
    build:
      context: ./docker/dsh
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.2-rc.1}
        DSH_SKILL_OFFICE_VERSION: ${DSH_SKILL_OFFICE_VERSION:-0.2.2-rc.1}
    image: cuberouter-dsh:${DSH_IMAGE_TAG:-latest}
    container_name: dsh
    restart: always
    ports:
      - "3080:3080"
    volumes:
      - ./data/dsh/zhongshan:/data
    environment:
      - DSH_HOME=/data
      - TZ=Asia/Shanghai
      - DSH_API_KEY=${DSH_API_KEY:-}  # CubeRouter DSH 渠道使用的密钥（X-API-Key / Bearer）；留空则关闭鉴权
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}  # Agent 调用模型所需的密钥
      - DSH_LLM_BASE_URL=${DSH_LLM_BASE_URL:-}  # 可选：把模型请求指向其它 OpenAI 兼容端点（例如本网关的 http://cuberouter:3000/v1）；留空用官方端点
      - DSH_TRUSTED_HOST=${DSH_TRUSTED_HOST:-}  # 可选：通过非 loopback 域名/IP 访问 3080 时填入该 authority（空格分隔，含端口写 host:port）
    networks:
      - cuberouter-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"X-API-Key: $$DSH_API_KEY\" \"http://$$(cat /tmp/dsh-bind-host):3080/api/v1/health\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: harbor.isuanova.com/library/redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - cuberouter-network

  postgres:
    image: harbor.isuanova.com/library/postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: cuberouter
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - cuberouter-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: cuberouter
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - cuberouter-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

#  clickhouse:
#    image: clickhouse/clickhouse-server:24.8
#    container_name: clickhouse
#    restart: always
#    environment:
#      CLICKHOUSE_DB: new_api_logs
#      CLICKHOUSE_USER: default
#      CLICKHOUSE_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
#    volumes:
#      - clickhouse_data:/var/lib/clickhouse
#    networks:
#      - cuberouter-network
#    ports:
#      - "8123:8123"  # HTTP interface, uncomment if you need external access
#      - "9000:9000"  # Native interface used by the LOG_SQL_DSN example above

volumes:
  pg_data:
#  mysql_data:
#  clickhouse_data:

networks:
  cuberouter-network:
    driver: bridge
