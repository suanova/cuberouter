name: CI Image

# Push-only so the image job never appears in pull request checks. The Go, web
# and KinD e2e checks run in tests.yml/e2e.yml on the same push; the docker
# build here also validates the full app compiles before anything is pushed.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Everything that can change the image CONTENT. The Dockerfile does
          # `COPY . .`, but .dockerignore keeps .md, docs/, .github/, Makefile,
          # e2e/ etc. out of the build context, so those never reach the image.
          # Besides .go files and web/, go:embed bakes non-Go files into the
          # binary (main.go, common/limiter/limiter.go, i18n/i18n.go) — if a new
          # //go:embed source is added, add its path here too.
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'VERSION'
              - 'LICENSE'
              - 'THIRD-PARTY-LICENSES.md'
              - 'go.mod'
              - 'go.sum'
              - '**.go'
              - 'web/**'
              - 'common/limiter/lua/**'
              - 'i18n/locales/**'
              - '.github/workflows/ci-image.yml'

  build-push-image:
    # Push the image only when a merge lands on main with image-relevant changes.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push image
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE=harbor.isuanova.com/suanova/cuberouter
          SHA_TAG="${GITHUB_SHA}"

          # Push the immutable, commit-addressed tag. Safe for any commit that
          # ever landed on main, even if a newer commit now exists.
          docker build -t "${IMAGE}:${SHA_TAG}" .
          docker push "${IMAGE}:${SHA_TAG}"

          # Only refresh the mutable `latest` tag if this run's commit is still
          # the head of main. An older run can finish after a newer main commit;
          # pushing its image as `latest` would mislabel which commit is newest.
          # (docker-build.yml publishes only versioned release tags, so `latest`
          # is exclusively owned here and always tracks the head of main.)
          CURRENT_MAIN="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
              | jq -r .commit.sha
          )"
          if [ "${CURRENT_MAIN}" = "${SHA_TAG}" ]; then
            docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          else
            echo "Skipping 'latest': ${SHA_TAG} is no longer the head of main (current: ${CURRENT_MAIN})"
          fi
