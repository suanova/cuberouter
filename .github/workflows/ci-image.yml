name: CI Image

# Push-only so the image job never appears in pull request checks. The Go, web
# and KinD e2e checks run in tests.yml/e2e.yml on the same push; the docker
# build here also validates the full app compiles before anything is pushed.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Everything that can change the image CONTENT. The Dockerfile builds
          # web/ and the VitePress docs sites (docs-site/) in-image, then does
          # `COPY . .`, but .dockerignore keeps .md (except docs-site/), docs/,
          # .github/, Makefile, e2e/ etc. out of the build context, so those
          # never reach the image. Besides .go files, web/ and docs-site/,
          # go:embed bakes non-Go files into the binary (main.go,
          # common/limiter/limiter.go, i18n/i18n.go) — if a new //go:embed
          # source is added, add its path here too.
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'VERSION'
              - 'LICENSE'
              - 'THIRD-PARTY-LICENSES.md'
              - 'go.mod'
              - 'go.sum'
              - '**.go'
              - 'web/**'
              - 'docs-site/**'
              - 'common/limiter/lua/**'
              - 'i18n/locales/**'
              - '.github/workflows/ci-image.yml'

  build-push-image:
    # Push the image only when a merge lands on main with image-relevant changes.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # One build per push; the release dispatch below consumes its digest.
    concurrency:
      group: ci-image-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      images_json: ${{ steps.publish.outputs.images_json }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push image
        id: publish
        run: |
          set -euo pipefail
          IMAGE=harbor.isuanova.com/suanova/cuberouter
          SHA_TAG="${GITHUB_SHA::7}"

          # The maintenance page reports this value. The checkout is shallow,
          # so take the channel label from VERSION (tags may not be fetched)
          # and append the built commit's short SHA.
          BASE_VERSION="$(cat VERSION)"
          echo "${BASE_VERSION}-$(git rev-parse --short HEAD)" > VERSION

          # Push the immutable, commit-addressed tag. Safe for any commit that
          # ever landed on main, even if a newer commit now exists.
          docker build -t "${IMAGE}:${SHA_TAG}" .
          docker push "${IMAGE}:${SHA_TAG}"

          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}:${SHA_TAG}" \
            | awk -F@ -v r="${IMAGE}" '$1==r {print $2; exit}')"
          [ -n "${digest}" ] || { echo "::error::cannot resolve digest for ${IMAGE}:${SHA_TAG}"; exit 1; }
          jq -nc --arg r "${IMAGE}:${SHA_TAG}" --arg d "${digest}" \
            '{name:"cuberouter",ref:$r,digest:$d}' > "${RUNNER_TEMP}/images.json"
          echo "images_json=$(cat "${RUNNER_TEMP}/images.json")" >> "$GITHUB_OUTPUT"

  notify-release:
    needs: build-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create an installation token for cubestack-release
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-release
          permission-contents: write
      - name: Dispatch component-built
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          IMAGES_JSON: ${{ needs.build-push-image.outputs.images_json }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repo "suanova/cuberouter" \
            --arg commit "${GITHUB_SHA}" \
            --arg line "2.1" \
            --arg component "cuberouter" \
            --argjson images "${IMAGES_JSON}" \
            '{event_type:"component-built",client_payload:{repo:$repo,commit:$commit,line:$line,component:$component,images:$images}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-release/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::component-built dispatch failed after 3 attempts"
          exit 1
