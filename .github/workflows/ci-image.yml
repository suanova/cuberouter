name: CI Image

# Push-only so the image job never appears in pull request checks. The Go, web
# and KinD e2e checks run in tests.yml/e2e.yml on the same push; the docker
# build here also validates the full app compiles before anything is pushed.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          # Everything that can change the image CONTENT. The Dockerfile builds
          # web/ and the VitePress docs sites (docs-site/) in-image, then does
          # `COPY . .`, but .dockerignore keeps .md (except docs-site/), docs/,
          # .github/, Makefile, e2e/ etc. out of the build context, so those
          # never reach the image. Besides .go files, web/ and docs-site/,
          # go:embed bakes non-Go files into the binary (main.go,
          # common/limiter/limiter.go, i18n/i18n.go) — if a new //go:embed
          # source is added, add its path here too.
          filters: |
            image:
              - 'Dockerfile'
              - '.dockerignore'
              - 'VERSION'
              - 'LICENSE'
              - 'THIRD-PARTY-LICENSES.md'
              - 'go.mod'
              - 'go.sum'
              - '**.go'
              - 'web/**'
              - 'docs-site/**'
              - 'common/limiter/lua/**'
              - 'i18n/locales/**'
              - '.github/workflows/ci-image.yml'

  build-push-image:
    # Push the image only when a merge lands on main with image-relevant changes.
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Cancel only the build phase; the notify job below must survive a newer
    # push so an already-moved latest still reaches the installer.
    concurrency:
      group: ci-image-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      latest_moved: ${{ steps.publish.outputs.latest_moved }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      - name: Build and push image
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE=harbor.isuanova.com/suanova/cuberouter
          SHA_TAG="${GITHUB_SHA}"

          # Push the immutable, commit-addressed tag. Safe for any commit that
          # ever landed on main, even if a newer commit now exists.
          docker build -t "${IMAGE}:${SHA_TAG}" .
          docker push "${IMAGE}:${SHA_TAG}"

          # Only refresh the mutable `latest` tag if this run's commit is still
          # the head of main. An older run can finish after a newer main commit;
          # pushing its image as `latest` would mislabel which commit is newest.
          # (docker-build.yml publishes only versioned release tags, so `latest`
          # is exclusively owned here and always tracks the head of main.)
          CURRENT_MAIN="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
              | jq -r .commit.sha
          )"
          if [ "${CURRENT_MAIN}" = "${SHA_TAG}" ]; then
            docker tag "${IMAGE}:${SHA_TAG}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
            echo "latest_moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping 'latest': ${SHA_TAG} is no longer the head of main (current: ${CURRENT_MAIN})"
            echo "latest_moved=false" >> "$GITHUB_OUTPUT"
          fi

  notify-installer:
    needs: build-push-image
    if: "!cancelled() && needs.build-push-image.outputs.latest_moved == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create an installation token for cubestack-installer
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-installer
          permission-contents: write
      - name: Dispatch refresh-latest-offline
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: suanova/cuberouter
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg r "${SOURCE_REPO}" \
            --arg s "${GITHUB_SHA}" \
            --arg u "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{event_type:"refresh-latest-offline",client_payload:{source_repo:$r,sha:$s,run_url:$u}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-installer/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::repository_dispatch failed after 3 attempts"
          exit 1
