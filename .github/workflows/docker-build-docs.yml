name: Publish docs images (version tags)

# Versioned builds of the two docs sites. ci-image.yml owns the commit-SHA and
# `latest` tags as the head-of-main pointer; this workflow publishes immutable
# version tags (e.g. v1.0.0) so a deployment can pin the docs images with
# `CUBEROUTER_IMAGE_TAG=v1.0.0` in docker-compose.docs.yml. No `latest` is
# pushed here, matching docker-build.yml.
on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v1.0.0)'
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Resolve version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building docs images for tag: ${TAG}"

  build_docs_user:
    name: Build & push user docs (${{ needs.prepare.outputs.tag }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The docs Dockerfile COPYs docs/.vitepress/dist into the nginx image, so
      # the VitePress static build must run before docker build.
      - name: Build static docs
        working-directory: docs-site/user
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}

      - name: Build & push image
        run: |
          set -euo pipefail
          IMAGE="harbor.isuanova.com/suanova/cuberouter-docs-user"
          TAG="${{ needs.prepare.outputs.tag }}"

          # Version tag only. `latest` is owned by ci-image.yml as the
          # head-of-main pointer, so this workflow never touches it.
          docker build -t "${IMAGE}:${TAG}" docs-site/user
          docker push "${IMAGE}:${TAG}"

      - name: Image summary
        run: |
          echo "### User docs image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "harbor.isuanova.com/suanova/cuberouter-docs-user:${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build_docs_admin:
    name: Build & push admin docs (${{ needs.prepare.outputs.tag }})
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The docs Dockerfile COPYs docs/.vitepress/dist into the nginx image, so
      # the VitePress static build must run before docker build.
      - name: Build static docs
        working-directory: docs-site/admin
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}

      - name: Build & push image
        run: |
          set -euo pipefail
          IMAGE="harbor.isuanova.com/suanova/cuberouter-docs-admin"
          TAG="${{ needs.prepare.outputs.tag }}"

          # Version tag only. `latest` is owned by ci-image.yml as the
          # head-of-main pointer, so this workflow never touches it.
          docker build -t "${IMAGE}:${TAG}" docs-site/admin
          docker push "${IMAGE}:${TAG}"

      - name: Image summary
        run: |
          echo "### Admin docs image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "harbor.isuanova.com/suanova/cuberouter-docs-admin:${{ needs.prepare.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
