name: CI Chart

# Push-only so the chart publish job never appears in pull request checks —
# same as the image workflow. A merge to main publishes the rolling
# <version>-latest chart; a v* tag publishes the release version it names.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            chart:
              - 'helm/cuberouter-chart/**'
              - '.github/workflows/ci-chart.yml'

  build-push-chart:
    # A release publishes every tag; a merge publishes only when the chart changed.
    needs: changes
    if: always() && (github.ref_type == 'tag' || needs.changes.outputs.chart == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.package.outputs.dev }}
      chart_json: ${{ steps.push.outputs.chart_json }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0
      # helm is preinstalled on ubuntu-24.04 runners — no install step needed.
      - name: Log in to Harbor (helm + oras)
        env:
          # Pass credentials through the environment, never inline: Harbor
          # robot account names contain a literal '$' (robot$<name>) and
          # passwords may contain any shell metacharacter. Env values bypass
          # shell parsing; only the variable reference is expanded below.
          HARBOR_USERNAME: ${{ vars.CI_BOT_NAME }}
          HARBOR_PASSWORD: ${{ secrets.CI_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          helm registry login harbor.isuanova.com \
            -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"
          printf '%s' "$HARBOR_PASSWORD" | oras login harbor.isuanova.com \
            -u "$HARBOR_USERNAME" --password-stdin
      - name: Package the chart
        id: package
        working-directory: helm/cuberouter-chart
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${GITHUB_REF_NAME}"
            SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
            if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER"; then
              echo "::error::tag '${GITHUB_REF_NAME}' is not a release version; expected vX.Y.Z or vX.Y.Z-<prerelease>"
              exit 1
            fi
            echo "dev=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(helm show chart . | awk '/^version:/{print $2}')"
            APP_VERSION="v${VERSION}"
            echo "dev=true" >> "$GITHUB_OUTPUT"
          fi

          helm package . --version "$VERSION" --app-version "$APP_VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tgz=cuberouter-chart-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
      - name: Push release chart (OCI)
        if: steps.package.outputs.dev != 'true'
        working-directory: helm/cuberouter-chart
        run: |
          set -euo pipefail
          helm push "cuberouter-chart-${{ steps.package.outputs.version }}.tgz" \
            oci://harbor.isuanova.com/suanova
      - name: Push dev chart with channel tag
        id: push
        if: steps.package.outputs.dev == 'true'
        working-directory: helm/cuberouter-chart
        env:
          CHART_VERSION: ${{ steps.package.outputs.version }}
          CHART_TGZ: ${{ steps.package.outputs.tgz }}
        run: |
          set -euo pipefail
          chart_repo="harbor.isuanova.com/suanova/cuberouter-chart"
          chart_channel="sha-${GITHUB_SHA::7}"
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import json, os, yaml
          meta = yaml.safe_load(open("Chart.yaml"))
          json.dump(meta, open(os.path.join(os.environ["RUNNER_TEMP"], "helm-config.json"), "w"), separators=(",", ":"))
          PY
          out="$(oras push "${chart_repo}:${chart_channel}" \
            "${CHART_TGZ}:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
            --config "${RUNNER_TEMP}/helm-config.json:application/vnd.cncf.helm.config.v1+json")"
          manifest_digest="$(printf '%s' "$out" | sed -n 's/^Digest: //p' | tail -1)"
          [ -n "$manifest_digest" ] || { echo "::error::cannot resolve chart manifest digest"; exit 1; }
          tgz_digest="sha256:$(sha256sum "$CHART_TGZ" | awk '{print $1}')"
          jq -nc --arg v "$CHART_VERSION" --arg d "$tgz_digest" --arg m "$manifest_digest" \
            '{version:$v,digest:$d,manifest_digest:$m}' > "${RUNNER_TEMP}/chart.json"
          echo "chart_json=$(cat "${RUNNER_TEMP}/chart.json")" >> "$GITHUB_OUTPUT"

  notify-release:
    needs: build-push-chart
    if: needs.build-push-chart.outputs.dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create an installation token for cubestack-release
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-release
          permission-contents: write
      - name: Dispatch component-built
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART_JSON: ${{ needs.build-push-chart.outputs.chart_json }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repo "suanova/cuberouter" \
            --arg commit "${GITHUB_SHA}" \
            --arg line "2.1" \
            --arg component "cuberouter" \
            --argjson chart "${CHART_JSON}" \
            '{event_type:"component-built",client_payload:{repo:$repo,commit:$commit,line:$line,component:$component,chart:$chart}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-release/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::component-built dispatch failed after 3 attempts"
          exit 1
