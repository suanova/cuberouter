name: CI Chart

# Push-only so the chart publish job never appears in pull request checks —
# same as the image workflow. A merge publishes the <version>-sha<7> chart, and
# main also the rolling <version>-latest; a v* tag publishes the release version.
on:
  push:
    # A release branch keeps shipping point releases, so a merge there still has
    # to produce the commit-addressed chart offline packaging pins.
    branches: [main, 'release-*']
    tags: ['v*']

permissions: {}

concurrency:
  group: ci-chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # A tag has no diff base, and a release publishes regardless of what changed.
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so paths-filter can diff against the base ref without fetching
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            chart:
              - 'helm/cuberouter-chart/**'
              - '.github/workflows/ci-chart.yml'

  build-push-chart:
    # A release publishes every tag; a merge publishes only when the chart changed.
    needs: changes
    if: always() && (github.ref_type == 'tag' || needs.changes.outputs.chart == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      line: ${{ steps.line.outputs.line }}
      dev: ${{ steps.package.outputs.dev }}
      chart_json: ${{ steps.push.outputs.chart_json }}
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the line
        id: line
        run: |
          # Read here, not in the notify job: that one has no checkout, so
          # VERSION_LINE is not in its workspace.
          line="$(tr -d '[:space:]' < VERSION_LINE)"
          [[ "${line}" =~ ^[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::invalid VERSION_LINE: '${line}'"; exit 1; }
          if [[ "${GITHUB_REF_NAME}" == release-* && "${GITHUB_REF_NAME}" != "release-${line}" ]]; then
            echo "::error::VERSION_LINE=${line} does not match ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "line=${line}" >> "${GITHUB_OUTPUT}"
      - name: Install oras
        uses: oras-project/setup-oras@ca28077386065e263c03428f4ae0c09024817c93 # v1.2.0
        with:
          version: 1.2.0
      # helm is preinstalled on ubuntu-24.04 runners — no install step needed.
      - name: Log in to Harbor (helm + oras)
        env:
          # Pass credentials through the environment, never inline: Harbor
          # robot account names contain a literal '$' (robot$<name>) and
          # passwords may contain any shell metacharacter. Env values bypass
          # shell parsing; only the variable reference is expanded below.
          HARBOR_USERNAME: ${{ vars.CI_BOT_NAME }}
          HARBOR_PASSWORD: ${{ secrets.CI_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          helm registry login harbor.isuanova.com \
            -u "$HARBOR_USERNAME" -p "$HARBOR_PASSWORD"
          printf '%s' "$HARBOR_PASSWORD" | oras login harbor.isuanova.com \
            -u "$HARBOR_USERNAME" --password-stdin
      - name: Package the chart
        id: package
        working-directory: helm/cuberouter-chart
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${GITHUB_REF_NAME}"
            SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
            if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER"; then
              echo "::error::tag '${GITHUB_REF_NAME}' is not a release version; expected vX.Y.Z or vX.Y.Z-<prerelease>"
              exit 1
            fi
            # `<version>-latest` and `<version>-sha<7>` are the chart tags main
            # publishes. A release tag shaped like either is valid semver but
            # would push the chart over that channel.
            case "$VERSION" in
              *-latest|*-sha[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
                echo "::error::'$VERSION' collides with a main chart tag"; exit 1 ;;
            esac
            echo "dev=false" >> "$GITHUB_OUTPUT"
          else
            # One chart per commit, and the commit is in the version: the
            # release lock records this version, the installer pushes the chart
            # into the cluster registry under it, and the CR names it back, so
            # it has to be unique per commit and never `latest`.
            BASE="$(helm show chart . | awk '/^version:/{print $2}')"
            VERSION="${BASE}-sha${GITHUB_SHA::7}"
            # appVersion is the default image tag. `latest` rather than the
            # commit: this repo builds its image only when its own paths change,
            # so a commit-addressed tag may not exist, and `latest` always does.
            # Commercial installs never read appVersion.
            APP_VERSION="latest"
            # Main also publishes the rolling name an open-source install uses.
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              EXTRA_VERSION="${BASE}-latest"
            fi
            echo "dev=true" >> "$GITHUB_OUTPUT"
          fi

          # Package into RUNNER_TEMP, not the chart directory: this chart has no
          # .helmignore, so a second `helm package .` would sweep the first
          # archive into the second one.
          out="${RUNNER_TEMP}/charts"
          mkdir -p "${out}"
          helm package . --destination "${out}" --version "$VERSION" --app-version "$APP_VERSION"
          if [ -n "${EXTRA_VERSION:-}" ]; then
            helm package . --destination "${out}" --version "${EXTRA_VERSION}" --app-version "$APP_VERSION"
            echo "extra-version=${EXTRA_VERSION}" >> "$GITHUB_OUTPUT"
            echo "extra-tgz=${out}/cuberouter-chart-${EXTRA_VERSION}.tgz" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tgz=${out}/cuberouter-chart-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
      - name: Push release chart (OCI)
        if: steps.package.outputs.dev != 'true'
        working-directory: helm/cuberouter-chart
        run: |
          set -euo pipefail
          helm push "cuberouter-chart-${{ steps.package.outputs.version }}.tgz" \
            oci://harbor.isuanova.com/suanova
      - name: Push dev chart with channel tag
        id: push
        if: steps.package.outputs.dev == 'true'
        working-directory: helm/cuberouter-chart
        env:
          CHART_VERSION: ${{ steps.package.outputs.version }}
          CHART_TGZ: ${{ steps.package.outputs.tgz }}
          EXTRA_TGZ: ${{ steps.package.outputs.extra-tgz }}
        run: |
          set -euo pipefail
          chart_repo="harbor.isuanova.com/suanova/cuberouter-chart"
          EXTRA_VERSION="${{ steps.package.outputs.extra-version }}"
          # A Debian-packaged python refuses a system-wide install (PEP 668);
          # hosted runners pre-install PyYAML and never reach the install.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet pyyaml \
            || python3 -m pip install --quiet --break-system-packages pyyaml
          # The OCI config is the chart's metadata, so it comes out of the
          # package being pushed: the source Chart.yaml still carries the file's
          # own version and appVersion, which `helm package` overrode without
          # rewriting it. Built per package, so each tag's config names its own
          # version.
          push_chart() {
            local tag="$1" pkg="$2"
            python3 - "$pkg" "${RUNNER_TEMP}/helm-config.json" <<'PY'
          import json, sys, tarfile, yaml
          with tarfile.open(sys.argv[1]) as tf:
              top = tf.getnames()[0].split("/")[0]
              meta = yaml.safe_load(tf.extractfile(f"{top}/Chart.yaml"))
          json.dump(meta, open(sys.argv[2], "w"), separators=(",", ":"))
          PY
            oras push "${chart_repo}:${tag}" \
              "${pkg}:application/vnd.cncf.helm.chart.content.v1.tar+gzip" \
              --config "${RUNNER_TEMP}/helm-config.json:application/vnd.cncf.helm.config.v1+json"
          }
          # The commit-addressed tag the release lock records, plus the rolling
          # name an open-source install uses (main only).
          out="$(push_chart "${CHART_VERSION}" "${CHART_TGZ}")"
          if [ -n "${EXTRA_VERSION}" ]; then
            push_chart "${EXTRA_VERSION}" "${EXTRA_TGZ}" >/dev/null
          fi
          manifest_digest="$(printf '%s' "$out" | sed -n 's/^Digest: //p' | tail -1)"
          [ -n "$manifest_digest" ] || { echo "::error::cannot resolve chart manifest digest"; exit 1; }
          tgz_digest="sha256:$(sha256sum "$CHART_TGZ" | awk '{print $1}')"
          jq -nc --arg v "$CHART_VERSION" --arg d "$tgz_digest" --arg m "$manifest_digest" \
            '{version:$v,digest:$d,manifest_digest:$m}' > "${RUNNER_TEMP}/chart.json"
          echo "chart_json=$(cat "${RUNNER_TEMP}/chart.json")" >> "$GITHUB_OUTPUT"

  notify-release:
    needs: build-push-chart
    if: needs.build-push-chart.outputs.dev == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Create an installation token for cubestack-release
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-release
          permission-contents: write
      - name: Dispatch component-built
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHART_JSON: ${{ needs.build-push-chart.outputs.chart_json }}
        run: |
          set -euo pipefail
          payload="$(jq -nc \
            --arg repo "suanova/cuberouter" \
            --arg commit "${GITHUB_SHA}" \
            --arg line "${{ needs.build-push-chart.outputs.line }}" \
            --arg component "cuberouter" \
            --argjson chart "${CHART_JSON}" \
            '{event_type:"component-built",client_payload:{repo:$repo,commit:$commit,line:$line,component:$component,chart:$chart}}')"
          for i in 1 2 3; do
            if printf '%s' "${payload}" | gh api --method POST \
                repos/suanova/cubestack-release/dispatches --input -; then
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "::error::component-built dispatch failed after 3 attempts"
          exit 1
