name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Fires on mergify merge-queue branches so queue merges can be gated on checks.
  merge_group:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod pins go 1.25.1; tests are hermetic (in-memory SQLite via
          # glebarez, miniredis, httptest) so no external services are needed.
          go-version-file: go.mod
          cache: true

      # main.go embeds web/dist, which is gitignored and only produced by the
      # frontend build. go test needs the embed patterns to resolve, so create
      # a placeholder index.html before compiling the root package.
      - name: Create web/dist placeholder for go:embed
        run: |
          mkdir -p web/dist
          echo '<!doctype html>' > web/dist/index.html

      - name: go test ./...
        run: go test -race -count=1 ./...

  web-test:
    name: Web tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The upstream Vitest migration standardized the web test suite on
      # vitest with jsdom + React Testing Library (vitest.config.ts,
      # src/test-setup.ts). Run the same suite CI runs in ci.yml.
      - name: vitest
        run: bun run test
