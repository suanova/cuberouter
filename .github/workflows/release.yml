name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - '*'
      - '!*-alpha*'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'cuberouter/common.Version=$VERSION' -extldflags '-static'" -o cuberouter-$VERSION
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'cuberouter/common.Version=$VERSION' -extldflags '-static'" -o cuberouter-arm64-$VERSION
      - name: Generate checksums
        run: sha256sum cuberouter-* > checksums-linux.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cuberouter-*
            checksums-linux.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-X 'cuberouter/common.Version=$VERSION'" -o cuberouter-macos-$VERSION
      - name: Generate checksums
        run: shasum -a 256 cuberouter-macos-* > checksums-macos.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cuberouter-macos-*
            checksums-macos.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: Windows Release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$VERSION bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '>=1.25.1'
      - name: Build Backend
        run: |
          go mod download
          go build -ldflags "-s -w -X 'cuberouter/common.Version=$VERSION'" -o cuberouter-$VERSION.exe
      - name: Generate checksums
        run: sha256sum cuberouter-*.exe > checksums-windows.txt

      - name: Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            cuberouter-*.exe
            checksums-windows.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  offline-package:
    name: Offline package (compose images)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          VERSION=$(git describe --tags)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "CUBEROUTER_IMAGE_TAG=$VERSION" >> $GITHUB_ENV
      - name: Log in to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.isuanova.com
          username: ${{ vars.CI_BOT_NAME }}
          password: ${{ secrets.CI_BOT_PASSWORD }}
      # docker-build.yml / docker-build-docs.yml publish the versioned images in
      # parallel with this workflow on the same tag push, so poll until every
      # image required by the compose stack exists in Harbor before pulling it.
      - name: Wait for required images to be ready
        run: |
          set -euo pipefail
          images=$(docker compose -f docker-compose.yml -f docker-compose.docs.yml config --images | sort -u)
          echo "Required images:"
          echo "$images"
          deadline=$(( $(date +%s) + 1800 ))
          for img in $images; do
            until docker manifest inspect "$img" >/dev/null 2>&1; do
              now=$(date +%s)
              if [ "$now" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for image $img to be ready"
                exit 1
              fi
              echo "waiting for $img..."
              sleep 30
            done
            echo "ready: $img"
          done
      - name: Build offline package
        run: make offline-package
      - name: Upload offline package to MinIO
        env:
          MINIO_HOSTNAME: ${{ secrets.MINIO_HOSTNAME }}
          MINIO_USERNAME: ${{ secrets.MINIO_USERNAME }}
          MINIO_PASSWORD: ${{ secrets.MINIO_PASSWORD }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'cuberouter' }}
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "$MINIO_USERNAME" --profile minio
          aws configure set aws_secret_access_key "$MINIO_PASSWORD" --profile minio
          aws --profile minio --endpoint-url "$MINIO_HOSTNAME" \
            s3 cp "cuberouter-$VERSION.tar.gz" \
            "s3://$MINIO_BUCKET/releases/cuberouter-$VERSION.tar.gz"
          echo "Uploaded to s3://$MINIO_BUCKET/releases/cuberouter-$VERSION.tar.gz"
