# Default values for cuberouter.
#
# PostgreSQL and Redis are required and always managed by operators (HA):
#   PostgreSQL : Crunchy PostgresCluster (Patroni failover)
#                + postgresql-operator subchart (installed together)
#   Redis      : OpsTree RedisReplication (embedded sentinel set)
#                + redis-operator subchart (installed together)
# See README.md.

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# App configuration (ConfigMap, injected via envFrom)
# ---------------------------------------------------------------------------
config:
  BATCH_UPDATE_ENABLED: "true"
  ERROR_LOG_ENABLED: "true"
  NODE_TYPE: master
  PORT: "3000"
  TZ: Asia/Shanghai
  # Additional plain environment variables (name: value)
  extra: {}

# ---------------------------------------------------------------------------
# App secret: SQL_DSN / REDIS_CONN_STRING / SESSION_SECRET / CRYPTO_SECRET /
# REDIS_PASSWORD / POSTGRES_PASSWORD
# create=true  : chart creates the secret; empty secrets.* values are
#                generated (stable across upgrades via lookup).
# create=false : point existingSecret at a pre-created secret (0.6.0 pattern).
# ---------------------------------------------------------------------------
secret:
  create: true
  existingSecret: ""

secrets:
  SESSION_SECRET: ""
  CRYPTO_SECRET: ""
  REDIS_PASSWORD: ""
  POSTGRES_PASSWORD: ""

# ---------------------------------------------------------------------------
# CubeRouter application (always installed)
# ---------------------------------------------------------------------------
cubeRouter:
  replicaCount: 2
  image:
    repository: harbor.isuanova.com/suanova/cuberouter
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  persistence:
    data:
      enabled: true
      size: 10Gi
      storageClassName: ""
      mountPath: /data
    logs:
      enabled: true
      size: 10Gi
      storageClassName: ""
      mountPath: /app/logs
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Extra env entries: [{name: X, value: "1"}]
  envVars: []
  # Optional entrypoint override (useful for smoke/stub images)
  command: []
  args: []
  nodeSelector: {}
  tolerations: []

# ---------------------------------------------------------------------------
# Docs site
# ---------------------------------------------------------------------------
docs:
  enabled: true
  replicaCount: 1
  image:
    repository: harbor.isuanova.com.cn/suanova/cuberouter
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  app:
    minAvailable: 1

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - cuberouter.com
    - www.cuberouter.com
    - cuberouter.com
    - www.cuberouter.com
  tls:
    enabled: true
    secretName: cuberouter-tls
  docs:
    hosts:
      - docs.cuberouter.com
      - docs.cuberouter.com
    tls:
      enabled: true
      secretName: cuberouter-docs-tls

# ---------------------------------------------------------------------------
# PostgreSQL — HA cluster via CrunchyData PGO (PostgresCluster CR)
# ---------------------------------------------------------------------------
postgresql:
  auth:
    database: cuberouter
    # Crunchy requires [a-z0-9-] only (no underscores)
    username: cuberouter
  # Must match the image major version
  postgresVersion: 16
  # >= 2 for HA (Patroni automatic failover)
  replicas: 2
  storage: 20Gi
  storageClassName: ""
  # Empty = operator RELATED_IMAGE_POSTGRES_<postgresVersion>
  image: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  backups:
    enabled: true
    schedule: "0 2 * * 0"
    storage: 20Gi
  pgBouncer:
    enabled: false
    replicas: 2
  # Post-install Job syncing the chart password onto the app role (the
  # operator auto-generates passwords) and granting schema rights.
  # Idempotent, re-runs on upgrade.
  initJob:
    enabled: true
    # Empty = same image as the cluster
    image: ""

# ---------------------------------------------------------------------------
# Redis — HA failover via OpsTree redis-operator (RedisReplication CR with
# an embedded sentinel set)
# ---------------------------------------------------------------------------
redis:
  # Image of the redis instances (the operator requires the opstree images)
  image:
    repository: quay.io/opstree/redis
    tag: v7.0.15
    pullPolicy: IfNotPresent
  # Total redis nodes: 1 master + (N-1) replicas
  replicas: 2
  # Number of sentinel nodes (automatic failover)
  sentinelReplicas: 3
  sentinelImage:
    repository: quay.io/opstree/redis-sentinel
    tag: v7.0.15
    pullPolicy: IfNotPresent
  # Extra redis.conf parameters: list of "<key> <value>" strings, applied via CONFIG SET
  redisCustomConfig: []
  persistence:
    enabled: false
    size: 10Gi
    storageClassName: ""

# ---------------------------------------------------------------------------
# Operator subcharts (vendored under charts/, offline-installable).
# Always installed together with the managed stores; image and resources
# can be tuned here.
# ---------------------------------------------------------------------------
postgresql-operator:
  image:
    repository: registry.developers.crunchydata.com/crunchydata/postgres-operator
    tag: ubi9-6.0.2-0
    pullPolicy: IfNotPresent
  relatedImages: {}
  resources: {}

redis-operator:
  image:
    repository: quay.io/opstree/redis-operator
    tag: v0.26.0
    pullPolicy: Always
  resources: {}
