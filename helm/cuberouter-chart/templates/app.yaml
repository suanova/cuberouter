{{- $f := include "cuberouter.fullname" . }}
{{- $secretName := include "cuberouter.secretName" . }}
{{- if .Values.cubeRouter.persistence.data.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $f }}-app-data
  labels:
    {{- include "cuberouter.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.cubeRouter.persistence.data.storageClassName }}
  storageClassName: {{ .Values.cubeRouter.persistence.data.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cubeRouter.persistence.data.size }}
---
{{- end }}
{{- if .Values.cubeRouter.persistence.logs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $f }}-app-logs
  labels:
    {{- include "cuberouter.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.cubeRouter.persistence.logs.storageClassName }}
  storageClassName: {{ .Values.cubeRouter.persistence.logs.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cubeRouter.persistence.logs.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $f }}-app
  labels:
    {{- include "cuberouter.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.cubeRouter.service.type }}
  selector:
    {{- include "cuberouter.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.cubeRouter.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $f }}
  labels:
    {{- include "cuberouter.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  replicas: {{ .Values.cubeRouter.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "cuberouter.selectorLabels" (dict "root" . "component" "app") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "cuberouter.selectorLabels" (dict "root" . "component" "app") | nindent 8 }}
    spec:
      containers:
        - name: cuberouter
          image: "{{ .Values.cubeRouter.image.repository }}:{{ .Values.cubeRouter.image.tag }}"
          imagePullPolicy: {{ .Values.cubeRouter.image.pullPolicy }}
          {{- with .Values.cubeRouter.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cubeRouter.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ $f }}-config
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SQL_DSN
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: REDIS_CONN_STRING
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: SESSION_SECRET
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: CRYPTO_SECRET
            {{- range .Values.cubeRouter.envVars }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.cubeRouter.persistence.data.enabled }}
            - name: cuberouter-data
              mountPath: {{ .Values.cubeRouter.persistence.data.mountPath }}
            {{- end }}
            {{- if .Values.cubeRouter.persistence.logs.enabled }}
            - name: cuberouter-logs
              mountPath: {{ .Values.cubeRouter.persistence.logs.mountPath }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.cubeRouter.resources | nindent 12 }}
      volumes:
        {{- if .Values.cubeRouter.persistence.data.enabled }}
        - name: cuberouter-data
          persistentVolumeClaim:
            claimName: {{ $f }}-app-data
        {{- end }}
        {{- if .Values.cubeRouter.persistence.logs.enabled }}
        - name: cuberouter-logs
          persistentVolumeClaim:
            claimName: {{ $f }}-app-logs
        {{- end }}
      {{- with .Values.cubeRouter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cubeRouter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
