{{/*
App secret resolution.

Precedence per key:
  1. .Values.secrets.<KEY>            (explicit)
  2. existing secret value            (via lookup, stable across upgrades)
  3. generated                        (randAlphaNum, new installs only)

SQL_DSN / REDIS_CONN_STRING are computed from the postgres/redis
configuration when no explicit value exists.
*/}}
{{- $secretName := include "cube-router.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- range $k, $v := $existing.data -}}
{{- $_ := set $existingData $k ($v | b64dec) -}}
{{- end -}}
{{- end -}}

{{- $sessionSecret := .Values.secrets.SESSION_SECRET -}}
{{- if not $sessionSecret }}{{ $sessionSecret = index $existingData "SESSION_SECRET" | default "" }}{{ end -}}
{{- if not $sessionSecret }}{{ $sessionSecret = randAlphaNum 32 }}{{ end -}}

{{- $cryptoSecret := .Values.secrets.CRYPTO_SECRET -}}
{{- if not $cryptoSecret }}{{ $cryptoSecret = index $existingData "CRYPTO_SECRET" | default "" }}{{ end -}}
{{- if not $cryptoSecret }}{{ $cryptoSecret = randAlphaNum 32 }}{{ end -}}

{{- $redisPassword := .Values.secrets.REDIS_PASSWORD -}}
{{- if not $redisPassword }}{{ $redisPassword = index $existingData "REDIS_PASSWORD" | default "" }}{{ end -}}
{{- if not $redisPassword }}{{ $redisPassword = randAlphaNum 24 }}{{ end -}}
{{- if or (contains "'" $redisPassword) (contains " " $redisPassword) }}
{{- fail "secrets.REDIS_PASSWORD must not contain single quotes or spaces" -}}
{{- end }}

{{- $postgresPassword := .Values.secrets.POSTGRES_PASSWORD -}}
{{- if not $postgresPassword }}{{ $postgresPassword = index $existingData "POSTGRES_PASSWORD" | default "" }}{{ end -}}
{{- if not $postgresPassword }}{{ $postgresPassword = randAlphaNum 24 }}{{ end -}}
{{- if or (contains "'" $postgresPassword) (contains " " $postgresPassword) }}
{{- fail "secrets.POSTGRES_PASSWORD must not contain single quotes or spaces" -}}
{{- end }}

{{- $pgUser := .Values.postgresql.auth.username -}}
{{- $pgDB := .Values.postgresql.auth.database -}}
{{- $sqlDSN := .Values.secrets.SQL_DSN -}}
{{- if not $sqlDSN }}{{ $sqlDSN = index $existingData "SQL_DSN" | default "" }}{{ end -}}
{{- if not $sqlDSN -}}
{{- if or .Values.postgresql.enabled .Values.postgresql.crunchy.enabled -}}
{{- $sqlDSN = printf "postgresql://%s:%s@%s/%s" $pgUser $postgresPassword (include "cube-router.postgresAddr" .) $pgDB -}}
{{- else -}}
{{- $sqlDSN = fail "secrets.SQL_DSN must be set when no postgresql mode (standalone/crunchy) is enabled" -}}
{{- end -}}
{{- end -}}

{{- $redisConnString := .Values.secrets.REDIS_CONN_STRING -}}
{{- if not $redisConnString }}{{ $redisConnString = index $existingData "REDIS_CONN_STRING" | default "" }}{{ end -}}
{{- if not $redisConnString -}}
{{- if or .Values.redis.enabled .Values.redis.operator.enabled -}}
{{- $redisConnString = printf "redis://:%s@%s" $redisPassword (include "cube-router.redisAddr" .) -}}
{{- else -}}
{{- $redisConnString = fail "secrets.REDIS_CONN_STRING must be set when no redis mode (standalone/operator) is enabled" -}}
{{- end -}}
{{- end -}}

{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cube-router.labels" . | nindent 4 }}
type: Opaque
stringData:
  SQL_DSN: {{ $sqlDSN | quote }}
  REDIS_CONN_STRING: {{ $redisConnString | quote }}
  SESSION_SECRET: {{ $sessionSecret | quote }}
  CRYPTO_SECRET: {{ $cryptoSecret | quote }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
{{- end }}
{{- if .Values.redis.operator.enabled }}
---
{{/*
Password secret consumed by the Spotahome redis-operator
(spec.auth.secretPath requires a secret with a `password` key).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cube-router.redisFailoverName" . }}-auth
  labels:
    {{- include "cube-router.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $redisPassword | quote }}
{{- end }}
