apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cuberouter.fullname" . }}-config
  labels:
    {{- include "cuberouter.labels" . | nindent 4 }}
data:
  BATCH_UPDATE_ENABLED: {{ .Values.config.BATCH_UPDATE_ENABLED | quote }}
  ERROR_LOG_ENABLED: {{ .Values.config.ERROR_LOG_ENABLED | quote }}
  NODE_TYPE: {{ .Values.config.NODE_TYPE | quote }}
  PORT: {{ .Values.config.PORT | quote }}
  TZ: {{ .Values.config.TZ | quote }}
  BASE_PATH: {{ .Values.config.BASE_PATH | quote }}
  {{- range $key, $value := .Values.config.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.mediaStudio.enabled }}
  MEDIA_STUDIO_S3_ENDPOINT: {{ .Values.mediaStudio.s3.endpoint | quote }}
  MEDIA_STUDIO_S3_BUCKET: {{ .Values.mediaStudio.s3.bucket | quote }}
  MEDIA_STUDIO_S3_REGION: {{ .Values.mediaStudio.s3.region | quote }}
  {{- end }}
