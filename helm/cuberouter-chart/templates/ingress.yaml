{{- if .Values.ingress.enabled }}
{{- $f := include "cube-router.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $f }}-ingress
  labels:
    {{- include "cube-router.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $f }}-app
                port:
                  number: {{ $.Values.cubeRouter.service.port }}
    {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
{{- if .Values.docs.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $f }}-docs-ingress
  labels:
    {{- include "cube-router.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.docs.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $f }}-docs
                port:
                  number: {{ $.Values.docs.service.port }}
    {{- end }}
  {{- if .Values.ingress.docs.tls.enabled }}
  tls:
    - hosts:
        {{- range .Values.ingress.docs.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.docs.tls.secretName }}
  {{- end }}
{{- end }}
{{- end }}
