{{- $f := include "cuberouter.fullname" . }}
{{- $cluster := include "cuberouter.postgresClusterName" . }}
{{- $user := .Values.postgresql.auth.username }}
{{- $db := .Values.postgresql.auth.database }}
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: {{ $cluster }}
  annotations:
    # operator creates a schema named after each user in that user's
    # databases, owned by the user (PG15+: users can no longer create
    # objects in the "public" schema without extra grants)
    postgres-operator.crunchydata.com/autoCreateUserSchema: "true"
  labels:
    {{- include "cuberouter.labels" . | nindent 4 }}
spec:
  {{- if .Values.postgresql.image }}
  image: {{ .Values.postgresql.image }}
  {{- end }}
  postgresVersion: {{ .Values.postgresql.postgresVersion }}
  users:
    - name: {{ $user }}
      databases:
        - {{ $db }}
  instances:
    - name: instance1
      replicas: {{ .Values.postgresql.replicas }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    postgres-operator.crunchydata.com/cluster: {{ $cluster }}
                topologyKey: kubernetes.io/hostname
      dataVolumeClaimSpec:
        accessModes:
          {{- toYaml (list "ReadWriteOnce") | nindent 10 }}
        {{- if .Values.postgresql.storageClassName }}
        storageClassName: {{ .Values.postgresql.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
      resources:
        {{- toYaml .Values.postgresql.resources | nindent 8 }}
  {{- if .Values.postgresql.backups.enabled }}
  backups:
    pgbackrest:
      # dedicated pgBackRest repo host Deployment
      repoHost: {}
      repos:
        - name: repo1
          schedules:
            full: {{ .Values.postgresql.backups.schedule | quote }}
          volume:
            volumeClaimSpec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: {{ .Values.postgresql.backups.storage }}
  {{- end }}
  {{- if .Values.postgresql.pgBouncer.enabled }}
  proxy:
    pgBouncer:
      replicas: {{ .Values.postgresql.pgBouncer.replicas }}
  {{- end }}
{{- if .Values.postgresql.initJob.enabled }}
---
{{/*
Post-install hook: waits for the operator to create the app user, then syncs
the app role password to the chart-generated one (the operator auto-generates
initial passwords, this chart uses its own). It connects as the app user
itself — a role may always change its own password, so no superuser access
is needed (PGO v6 does not expose a superuser password secret). Idempotent;
re-runs on upgrades, re-syncing the password if the operator re-applied
user SQL in the meantime.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $cluster }}-init
  labels:
    {{- include "cuberouter.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "10"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "cuberouter.selectorLabels" (dict "root" . "component" "postgresql") | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: {{ .Values.postgresql.initJob.image | default (include "cuberouter.postgresImage" .) }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: {{ $cluster }}-primary
            - name: PGUSER
              value: {{ $user }}
            - name: PGDATABASE
              value: {{ $db }}
            # PGO enforces TLS for client connections (pg_hba hostssl only)
            - name: PGSSLMODE
              value: require
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $cluster }}-pguser-{{ $user }}
                  key: password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cuberouter.secretName" . }}
                  key: POSTGRES_PASSWORD
          command:
            - bash
            - -ec
            - |
              echo "waiting for postgres user ${PGUSER} on ${PGHOST} ..."
              for _ in $(seq 1 300); do
                if psql -X -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -c "SELECT 1" >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              psql -X -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -c "SELECT 1" >/dev/null 2>&1 || {
                echo "postgres user ${PGUSER} did not become available in time"; exit 1;
              }

              echo "syncing password for role ${PGUSER}"
              psql -X -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 \
                -c "ALTER ROLE \"${PGUSER}\" WITH PASSWORD '${APP_PASSWORD}'"

              echo "postgres initialization complete"
{{- end }}
