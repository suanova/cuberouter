# Default values for the postgresql-operator subchart (CrunchyData PGO).
# Vendored from the official v6.0.2 kustomize installer (config/default).

# Number of operator replicas (leader election via lease; >1 for HA control plane)
replicas: 1

# Operator container image
image:
  repository: registry.developers.crunchydata.com/crunchydata/postgres-operator
  tag: ubi9-6.0.2-0
  pullPolicy: IfNotPresent

# RELATED_IMAGE_* environment variables. When a PostgresCluster does not
# specify an explicit image, the operator uses these images instead.
# Defaults follow the v6.0.2 kustomize installer.
relatedImages:
  POSTGRES_16: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-16.14-2621
  PGBACKREST: registry.developers.crunchydata.com/crunchydata/crunchy-pgbackrest:ubi9-2.58.0-2621
  PGBOUNCER: registry.developers.crunchydata.com/crunchydata/crunchy-pgbouncer:ubi9-1.25-2621
  PGEXPORTER: registry.developers.crunchydata.com/crunchydata/crunchy-postgres-exporter:ubi9-0.18.1-2621
  PGUPGRADE: registry.developers.crunchydata.com/crunchydata/crunchy-upgrade:ubi9-18.4-2621
  STANDALONE_PGADMIN: registry.developers.crunchydata.com/crunchydata/crunchy-pgadmin4:ubi9-9.15-2621
  COLLECTOR: registry.developers.crunchydata.com/crunchydata/postgres-operator:ubi9-6.0.2-0

# Comma-separated PGO feature gates (PGO_FEATURE_GATES)
featureGates: ""

# Verbose operator logging (CRUNCHY_DEBUG)
debug: false

# Operator resource requests/limits
resources: {}
#  requests:
#    cpu: 100m
#    memory: 256Mi
#  limits:
#    cpu: "1"
#    memory: 1Gi

nodeSelector: {}
tolerations: []
affinity: {}
