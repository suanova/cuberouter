apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: pgo
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    postgres-operator.crunchydata.com/control-plane: postgres-operator
  name: pgo
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      postgres-operator.crunchydata.com/control-plane: postgres-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgo
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        postgres-operator.crunchydata.com/control-plane: postgres-operator
    spec:
      containers:
      - env:
        - name: PGO_FEATURE_GATES
          value: {{ .Values.featureGates | quote }}
        - name: PGO_INSTALLER
          value: helm
        - name: PGO_INSTALLER_ORIGIN
          value: cuberouter-helm-chart
        - name: PGO_CONTROLLER_LEASE_NAME
          value: cpk-leader-election-lease
        - name: PGO_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CRUNCHY_DEBUG
          value: {{ .Values.debug | quote }}
        {{- range $name, $image := .Values.relatedImages }}
        - name: RELATED_IMAGE_{{ $name }}
          value: {{ $image | quote }}
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        livenessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: operator
        ports:
        - containerPort: 8443
          name: metrics
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: pgo
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
