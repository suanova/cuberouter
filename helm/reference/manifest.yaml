apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-router-docs
  namespace: cube-router
  labels:
    app.kubernetes.io/name: cube-router
    app.kubernetes.io/instance: cube-router
    app.kubernetes.io/component: docs
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: cube-router
      app.kubernetes.io/instance: cube-router
      app.kubernetes.io/component: docs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube-router
        app.kubernetes.io/instance: cube-router
        app.kubernetes.io/component: docs
    spec:
      imagePullSecrets:
        - name: huawei-swr
      containers:
        - name: docs
          image: "swr.ap-southeast-1.myhuaweicloud.com/cloud-mdgx/searouter-docs:v1.1.49-isuanova-agent-release"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
# Source: cube-router/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cube-router-app-hpa
  namespace: cube-router
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cube-router-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Source: cube-router/templates/redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cube-router-redis
  namespace: cube-router
  labels:
    app.kubernetes.io/name: cube-router
    app.kubernetes.io/instance: cube-router
    app.kubernetes.io/component: redis
spec:
  serviceName: cube-router-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube-router
      app.kubernetes.io/instance: cube-router
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube-router
        app.kubernetes.io/instance: cube-router
        app.kubernetes.io/component: redis
    spec:
      imagePullSecrets:
        - name: huawei-swr
      containers:
        - name: redis
          image: "swr.ap-southeast-1.myhuaweicloud.com/cloud-mdgx/redis:7-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cube-router-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
---
# Source: cube-router/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cube-router-ingress
  namespace: cube-router
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: cube-router.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cube-router-app
                port:
                  number: 80
    - host: www.cube-router.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cube-router-app
                port:
                  number: 80
    - host: cuberouter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cube-router-app
                port:
                  number: 80
    - host: www.cuberouter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cube-router-app
                port:
                  number: 80
  tls:
    - hosts:
        - cube-router.com
        - www.cube-router.com
        - cuberouter.com
        - www.cuberouter.com
      secretName: cube-router-tls
