# Source: cube-router/templates/app.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-router-app
  namespace: cube-router
  labels:
    app.kubernetes.io/name: cube-router
    app.kubernetes.io/instance: cube-router
    app.kubernetes.io/component: app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: cube-router
      app.kubernetes.io/instance: cube-router
      app.kubernetes.io/component: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube-router
        app.kubernetes.io/instance: cube-router
        app.kubernetes.io/component: app
    spec:
      imagePullSecrets:
        - name: huawei-swr
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z cube-router-redis 6379; do echo waiting for redis; sleep 2; done
      containers:
        - name: cube-router
          image: "swr.ap-southeast-1.myhuaweicloud.com/cloud-mdgx/searouter:v1.1.55-isuanova-agent-release"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: cube-router-config
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: cube-router-secret
                  key: SQL_DSN
            - name: REDIS_CONN_STRING
              valueFrom:
                secretKeyRef:
                  name: cube-router-secret
                  key: REDIS_CONN_STRING
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: cube-router-secret
                  key: SESSION_SECRET
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: cube-router-secret
                  key: CRYPTO_SECRET
          volumeMounts:
            - name: cube-router-data
              mountPath: /data
            - name: cube-router-logs
              mountPath: /app/logs
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: cube-router-data
          persistentVolumeClaim:
            claimName: cube-router-app-data
        - name: cube-router-logs
          persistentVolumeClaim:
            claimName: cube-router-app-logs
---
