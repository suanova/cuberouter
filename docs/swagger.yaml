basePath: /api/v2
definitions:
  controller.AggregatedAdjustQuotaRequest:
    properties:
      added_quota:
        description: 额度变化量，正数为增加额度，负数为扣减额度
        type: integer
    type: object
  controller.AggregatedBindSubscriptionRequest:
    properties:
      plan_id:
        description: 订阅计划 ID
        type: integer
    type: object
  controller.AggregatedCreatePlanRequest:
    properties:
      plan:
        allOf:
        - $ref: '#/definitions/model.SubscriptionPlan'
        description: 新格式：完整 plan 对象，与控制台 AdminCreateSubscriptionPlan 一致
    type: object
  controller.AggregatedCreateUserRequest:
    properties:
      email:
        type: string
      inviter_id:
        description: 运营用户邀请人 user id
        type: integer
      password:
        type: string
      plan_id:
        type: integer
      user_validity:
        description: ISO 8601 date, e.g. "2026-12-31"
        type: string
      username:
        type: string
    type: object
  dto.APIResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.ImportCsvAPIResponse:
    properties:
      data:
        $ref: '#/definitions/dto.ImportCsvResult'
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.ImportCsvResult:
    properties:
      channel_id:
        type: integer
      channel_update_failed:
        type: boolean
      completion_ratio_skipped:
        type: integer
      errors:
        items:
          $ref: '#/definitions/dto.ImportError'
        type: array
      intro_updated:
        type: integer
      models_failed:
        type: integer
      models_imported:
        type: integer
      models_in_csv:
        type: integer
      models_recognized:
        type: integer
      models_skipped:
        type: integer
      models_skipped_no_input:
        type: integer
      models_skipped_non_token:
        type: integer
      persisted_ratio_models:
        items:
          type: string
        type: array
      price_skipped:
        type: integer
      price_updated:
        type: integer
      ratio_persisted:
        items:
          type: string
        type: array
      warnings:
        items:
          $ref: '#/definitions/dto.ImportWarning'
        type: array
    type: object
  dto.ImportError:
    properties:
      model:
        type: string
      reason:
        type: string
    type: object
  dto.ImportWarning:
    properties:
      model:
        type: string
      reason:
        type: string
    type: object
  model.SubscriptionPlan:
    properties:
      allow_balance_pay:
        type: boolean
      allow_wallet_overflow:
        description: Allow falling back to wallet balance after subscription quota
          is exhausted (empty = true)
        type: boolean
      created_at:
        type: integer
      creem_product_id:
        type: string
      currency:
        type: string
      custom_seconds:
        type: integer
      downgrade_group:
        description: Downgrade user group on expiry (empty = revert to the group held
          before purchase)
        type: string
      duration_unit:
        type: string
      duration_value:
        type: integer
      enabled:
        type: boolean
      id:
        type: integer
      max_purchase_per_user:
        description: Max purchases per user (0 = unlimited)
        type: integer
      price_amount:
        description: 'Display money amount (follow existing code style: float64 for
          money)'
        type: number
      quota_reset_custom_seconds:
        type: integer
      quota_reset_period:
        description: Quota reset period for plan
        type: string
      sort_order:
        type: integer
      stripe_price_id:
        type: string
      subtitle:
        type: string
      title:
        type: string
      total_amount:
        description: Total quota (amount in quota units, 0 = unlimited)
        type: integer
      updated_at:
        type: integer
      upgrade_group:
        description: Upgrade user group after purchase (empty = no change)
        type: string
      waffo_pancake_product_id:
        type: string
    type: object
info:
  contact: {}
  description: new-api AI 网关 —— 用户与账号相关接口(对外第三方)
  title: new-api 用户 API
  version: "1.0"
paths:
  /channel/{id}/import_models_csv:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: 渠道 ID
        in: path
        name: id
        required: true
        type: integer
      - description: UCloud CSV 文件(UTF-8)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: data 为 dto.ImportCsvResult 结构化结果
          schema:
            $ref: '#/definitions/dto.ImportCsvAPIResponse'
        "400":
          description: invalid channel id / no_file / bad_header / invalid_csv_row
            / too_many_rows / bad_encoding / channel_not_found
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "413":
          description: file_too_large
          schema:
            $ref: '#/definitions/dto.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.APIResponse'
      security:
      - ApiKeyAuth: []
      summary: CSV 批量导入渠道模型/价格/介绍
      tags:
      - 渠道-模型导入
  /plans:
    post:
      consumes:
      - application/json
      parameters:
      - description: '创建订阅计划请求（推荐使用 {plan: {...}} 格式，与控制台参数一致）'
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.AggregatedCreatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, plan_id: int}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 创建订阅计划（聚合 API）
      tags:
      - 聚合API-订阅管理
  /users:
    post:
      consumes:
      - application/json
      parameters:
      - description: 创建用户请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.AggregatedCreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, user_id: string}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 创建用户（聚合 API，默认可用状态）
      tags:
      - 聚合API-用户管理
  /users/{user_id}/adjust-quota:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 额度调整请求（added_quota 为正数增加额度，负数扣减额度）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.AggregatedAdjustQuotaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, status_code: 2000, current_quota: int, current_price:
            float64, total_quota: int, total_price: float64}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 调整用户额度（聚合 API-额度调整）
      tags:
      - 聚合API-额度调整(增值套餐)
  /users/{user_id}/bind-subscription:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: 绑定订阅请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.AggregatedBindSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, status_code: 2000}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 给用户绑定订阅（聚合 API）
      tags:
      - 聚合API-订阅管理
  /users/{user_id}/delete:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, status_code: 2000}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 删除用户（聚合 API）
      tags:
      - 聚合API-用户管理
  /users/{user_id}/reactivate:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, status_code: 2000}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 启用用户（聚合 API）
      tags:
      - 聚合API-用户管理
  /users/{user_id}/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, status_code: 2000}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 发送重置密码邮件（聚合 API）
      tags:
      - 聚合API-用户管理
  /users/{user_id}/status:
    get:
      consumes:
      - application/json
      description: 返回用户基本信息和全部订阅计划列表，plans 按 id 降序排列
      parameters:
      - description: 用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, user_id, user_role, user_group, user_status,
            invitor_id, invitor_username, plans: [...], total_price, total_quota}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 查看用户状态（聚合 API）
      tags:
      - 聚合API-用户管理
  /users/{user_id}/suspend:
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{status: success, status_code: 2000}'
          schema:
            additionalProperties: true
            type: object
      security:
      - ApiKeyAuth: []
      summary: 禁用用户（聚合 API）
      tags:
      - 聚合API-用户管理
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
